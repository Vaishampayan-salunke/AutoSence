<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Rounded Container Icon -->
    <rect width="64" height="64" rx="16" fill="#030712" />
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
    
    <!-- Sleek Automobile Profile -->
    <path d="M10 44 C12 44 14 44 16 44 C17 40 21 37 25 37 C29 37 33 40 34 44 C38 44 42 44 44 44 C45 40 49 37 53 37 C56 37 58 38 59 40 C60 38 60 37 58 35 C56 33 50 31 46 29 L39 21 C37 19 33 18 29 18 L19 18 C16 18 13 20 11 23 L7 31 C6 33 6 36 6 39 C6 42 8 44 10 44 Z" fill="url(#carGrad)" filter="url(#glow)" />
    
    <!-- Car Cabin Window -->
    <path d="M20 22 L28 22 C31 22 34 23 35 24 L41 30 L16 30 L19 23 C19.3 22.4 19.6 22 20 22 Z" fill="#030712" fill-opacity="0.85" />
    
    <!-- Wheels -->
    <circle cx="25" cy="44" r="5" fill="#030712" stroke="#22d3ee" stroke-width="2" />
    <circle cx="25" cy="44" r="2" fill="#38bdf8" />
    <circle cx="51" cy="44" r="5" fill="#030712" stroke="#22d3ee" stroke-width="2" />
    <circle cx="51" cy="44" r="2" fill="#38bdf8" />

    <!-- Sentiment AI Energy Pulse / Lightning -->
    <polygon points="36,10 27,24 33,24 29,36 41,20 34,20" fill="url(#boltGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="0.8" />
</svg>
